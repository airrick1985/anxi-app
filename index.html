  <body>
    <div id="startup-screen" role="status" aria-live="polite">
      <strong>ANXI</strong>
      <div class="startup-spinner" aria-hidden="true"></div>
      <p id="startup-message">正在載入，請稍候…</p>
      <button id="startup-retry" type="button" hidden>重新載入</button>
      <noscript>請開啟瀏覽器的 JavaScript，才能使用此網站。</noscript>
    </div>
    <script>
      (() => {
        const screen = document.getElementById('startup-screen');
        const message = document.getElementById('startup-message');
        const retry = document.getElementById('startup-retry');
        const fail = () => {
          message.textContent = '載入時間較長，請確認網路連線，或重新載入。';
          retry.hidden = false;
        };
        const timer = setTimeout(fail, 15000);
        const onError = (event) => {
          if (event.target?.tagName === 'SCRIPT' || event instanceof ErrorEvent) fail();
        };
        window.addEventListener('error', onError, true);
        retry.addEventListener('click', () => {
          const url = new URL(location.href);
          url.searchParams.set('_v', String(Date.now()));
          location.replace(url.href);
        });
        window.__anxiStartup = {
          fail,
          finish() {
            clearTimeout(timer);
            window.removeEventListener('error', onError, true);
            screen.remove();
            delete window.__anxiStartup;
          }
        };
      })();
    </script>
    <div id="app"></div>
  </body>
